name: Pull Request Quality Check

on:
  pull_request:
    branches:
      - development
    types: [opened, synchronize, reopened]

jobs:
  validate:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Create .env file
        run: cp .env.example .env

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test Error Handling
        run: npm run test-errors:test

      - name: Test architecture
        run: npm run architecture:test

      - name: Check architecture
        run: npm run architecture

      - name: Check architecture with Semgrep
        run: npm run architecture:semgrep

      - name: Check duplication
        run: npm run duplication

      - name: Test Storybook
        run: npm run test:storybook:ci
        env:
          NEXT_PUBLIC_GRAPHQL_URI: http://localhost:3001/gql

      - name: Comment PR on failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              filter: 'latest',
              per_page: 100,
            });
            const currentJob = data.jobs.find(
              (job) =>
                job.name === context.job ||
                job.name.startsWith(`${context.job} (`),
            );
            const failedSteps = currentJob?.steps
              .filter((step) => step.conclusion === 'failure')
              .map((step) => `- ${step.name}`) ?? [];
            const failureSummary = failedSteps.length > 0
              ? `**Check:**\n${failedSteps.join('\n')}`
              : 'A quality-check step failed. Review the workflow logs for details.';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `❌ **Quality check failed!**\n\n${failureSummary}\n\n[View workflow logs](${runUrl})`,
            });

      - name: Comment PR on success
        if: success()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **Success! All checks have passed successfully!** \n\n' +
                    '- Build completed ✓\n' +
                    '- Tests passed ✓\n' +
                    '- Linter Code quality verified ✓\n' +
                    '- Architecture rules verified ✓\n\n' +
                    'The PR has been validated.'
            })
