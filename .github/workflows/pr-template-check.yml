name: Pull Request Description Check

on:
  pull_request:
    branches:
      - development
    # `edited` re-runs the check when the description is fixed, without a new push.
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  description-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x

      - name: Test template validator
        run: node --test tools/pr-template/check.test.mjs

      - name: Validate pull request description
        run: node tools/pr-template/check.mjs
        env:
          # Passed through the environment, never interpolated into the script.
          PR_BODY: ${{ github.event.pull_request.body }}
